<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="InstaFarma: tu autoservicio de confianza" />

    <title>Productos</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="css/index.css">

    <!-- Importación de fuentes Google Fonts e íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>
    <header class="header">
        <img class="icono" src="/img/logo.png" alt="Icono de InstaFarma">
        <div class="titulo">
            <h1>InstaFarma</h1>
        </div>
    </header>

    <main class="productos">
        <section id="contenedor-productos">
        </section>
        <section>
             <div class="carrito">
                <h2>Mi carrito</h2>
                <ul id="cart-list" class="cart-list"></ul>
                <h3>Total: $<span id="cart-total">0</span></h3>
                <button class="boton-invertido" type="button" id="btn-empty" onclick="vaciarCarrito(event)">Vaciar Carrito</button>
                <button class="boton" type="button" id="btn-empty" onclick="comprar(event)">Comprar</button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <span>2026 - InstaFarma - Amud, Correa</span>
    </footer>

    <script src="js/productos.js"></script>
</body>

</html>
