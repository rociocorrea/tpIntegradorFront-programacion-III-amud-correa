<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="InstaFarma: tu autoservicio de confianza" />

    <title>Bienvenida</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="css/index.css">

    <!-- Importación de fuentes Google Fonts e íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>
    <header class="header">
        <img class="icono" src="/img/logo.png" alt="Icono de InstaFarma">
        <div class="titulo">
            <h1>InstaFarma</h1>
        </div>
    </header>

    <main class="landing-main">
        <section class="hero">
            <div class="hero-content">
                <p class="hero-etiqueta">FARMACIA Y BELLEZA</p>
                <p class="hero-descripcion">
                    Todo lo que necesitás, en un solo lugar
                </p>
            </div>
        </section>

        <section class="formulario">
            <h4>Introduzca su nombre</h4>
            <form id="form-bienvenida">
                <input type="text" id="form-bienvenida-nombre" placeholder="Nombre">
                <input class="boton-enviar" type="submit" value="Enviar">
            </form>
        </section>
    </main>

    <footer class="footer">
        <span>2026 - InstaFarma - Amud, Correa</span>
    </footer>

    <script src="js/index.js"></script>
</body>

</html>
